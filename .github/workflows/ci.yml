name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    env:
      WACON_SKIP_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --version
      - name: Test the installed npm package
        shell: bash
        run: |
          package_file=$(npm pack --ignore-scripts --json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>console.log(JSON.parse(s)[0].filename))")
          npm install --prefix "$RUNNER_TEMP/wacon-smoke" "$PWD/$package_file"
          node scripts/smoke-package.mjs "$RUNNER_TEMP/wacon-smoke/node_modules/@josetra/wacon"
