name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    env:
      WACON_SKIP_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/index.js --version
      - name: Test the installed npm package
        shell: bash
        run: |
          # Do NOT parse `npm pack --json` output: on npm 10 (Node 22) the
          # prepare script's stdout (tsup's coloured "CLI" lines) is mixed
          # into it and JSON.parse explodes. That is why this step has been
          # red on Node 22 since 0.4.0. The tarball name is on disk instead.
          npm pack --ignore-scripts
          package_file=$(ls -t josetra-wacon-*.tgz | head -n 1)
          # --ignore-scripts on purpose: the SQLite binary ships inside the
          # better-sqlite3 package (N-API, since v13), so a user install must
          # work even when no install script runs and no build tools exist.
          # If a native dependency ever goes back to download/compile at
          # install time, this step goes red.
          npm install --ignore-scripts --prefix "$RUNNER_TEMP/wacon-smoke" "$PWD/$package_file"
          node scripts/smoke-package.mjs "$RUNNER_TEMP/wacon-smoke/node_modules/@josetra/wacon"
